<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: sans-serif; padding: 40px; background: #f5f5f7; }
#log { background: white; padding: 20px; border-radius: 14px; margin-bottom: 20px; min-height: 100px; font-size: 16px; }
button {
  display: block; width: 100%; height: 70px;
  margin-bottom: 20px; border-radius: 14px; border: none;
  font-size: 20px; font-weight: 600; color: white;
  background: #1d1d1f;
}
#box { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
#box div { background: white; padding: 40px; border-radius: 20px; text-align: center; font-size: 24px; }
#box button { width: 200px; background: red; margin-top: 20px; }
</style>
</head>
<body>

<div id="log">Toca los botones...</div>

<button id="btn1">BOTÓN 1 — Cambiar texto</button>
<button id="btn2">BOTÓN 2 — Mostrar caja negra</button>
<button id="btn3">BOTÓN 3 — Alert</button>

<div id="box">
  <div>
    ¡Funciona!
    <br>
    <button id="btn-cerrar">Cerrar</button>
  </div>
</div>

<script>
document.getElementById('btn1').addEventListener('click', function() {
  document.getElementById('log').textContent = 'Botón 1 funcionó — ' + new Date().toLocaleTimeString();
});

document.getElementById('btn2').addEventListener('click', function() {
  document.getElementById('log').textContent = 'Botón 2 tocado';
  document.getElementById('box').style.display = 'flex';
});

document.getElementById('btn3').addEventListener('click', function() {
  alert('Botón 3 funciona');
});

document.getElementById('btn-cerrar').addEventListener('click', function() {
  document.getElementById('box').style.display = 'none';
  document.getElementById('log').textContent = 'Cerrado correctamente';
});
</script>
</body>
</html>
