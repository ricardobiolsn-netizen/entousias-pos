<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; padding: 20px; background: #f5f5f7; }
#log { background: white; padding: 15px; border-radius: 12px; margin-bottom: 16px; font-size: 16px; min-height: 60px; border: 2px solid #34c759; }
h2 { font-size: 13px; color: #666; margin: 16px 0 8px; text-transform: uppercase; }
button { display: block; width: 100%; height: 60px; margin-bottom: 10px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; color: white; background: #1d1d1f; }

/* OPCIÓN 1: display flex */
#modal-flex {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  align-items: center; justify-content: center;
  z-index: 100;
}
/* OPCIÓN 2: display block con centrado por padding */
#modal-block {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  padding-top: 150px;
  text-align: center;
}
/* OPCIÓN 3: visibility hidden/visible */
#modal-vis {
  visibility: hidden;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  padding-top: 150px;
  text-align: center;
}
/* OPCIÓN 4: opacity 0/1 */
#modal-opacity {
  opacity: 0;
  pointer-events: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  padding-top: 150px;
  text-align: center;
}
/* OPCIÓN 5: translate fuera de pantalla */
#modal-translate {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  padding-top: 150px;
  text-align: center;
  transform: translateX(200%);
}

.modal-inner {
  display: inline-block;
  background: white; padding: 30px;
  border-radius: 20px; width: 280px;
  text-align: center;
}
.modal-inner h3 { margin-bottom: 16px; font-size: 20px; }
.modal-inner button { background: #ff3b30; }
</style>
</head>
<body>

<div id="log">Toca un botón...</div>

<h2>Opción 1 — display:flex</h2>
<button onclick="document.getElementById('modal-flex').style.display='flex'; log('1: display flex aplicado')">Abrir con display:FLEX</button>

<h2>Opción 2 — display:block</h2>
<button onclick="document.getElementById('modal-block').style.display='block'; log('2: display block aplicado')" style="background:#534AB7">Abrir con display:BLOCK</button>

<h2>Opción 3 — visibility</h2>
<button onclick="document.getElementById('modal-vis').style.visibility='visible'; log('3: visibility visible aplicado')" style="background:#1D9E75">Abrir con VISIBILITY</button>

<h2>Opción 4 — opacity</h2>
<button onclick="document.getElementById('modal-opacity').style.opacity='1'; document.getElementById('modal-opacity').style.pointerEvents='auto'; log('4: opacity 1 aplicado')" style="background:#BA7517">Abrir con OPACITY</button>

<h2>Opción 5 — translateX</h2>
<button onclick="document.getElementById('modal-translate').style.transform='translateX(0)'; log('5: translate 0 aplicado')" style="background:#D4537E">Abrir con TRANSLATE</button>

<!-- MODALES -->
<div id="modal-flex">
  <div class="modal-inner">
    <h3>✅ FLEX funciona</h3>
    <button onclick="document.getElementById('modal-flex').style.display='none'">Cerrar</button>
  </div>
</div>

<div id="modal-block">
  <div class="modal-inner">
    <h3>✅ BLOCK funciona</h3>
    <button onclick="document.getElementById('modal-block').style.display='none'">Cerrar</button>
  </div>
</div>

<div id="modal-vis">
  <div class="modal-inner">
    <h3>✅ VISIBILITY funciona</h3>
    <button onclick="document.getElementById('modal-vis').style.visibility='hidden'">Cerrar</button>
  </div>
</div>

<div id="modal-opacity">
  <div class="modal-inner">
    <h3>✅ OPACITY funciona</h3>
    <button onclick="document.getElementById('modal-opacity').style.opacity='0'; document.getElementById('modal-opacity').style.pointerEvents='none'">Cerrar</button>
  </div>
</div>

<div id="modal-translate">
  <div class="modal-inner">
    <h3>✅ TRANSLATE funciona</h3>
    <button onclick="document.getElementById('modal-translate').style.transform='translateX(200%)'">Cerrar</button>
  </div>
</div>

<script>
function log(msg) {
  document.getElementById('log').innerHTML = msg + '<br><small>' + new Date().toLocaleTimeString() + '</small>';
}
</script>
</body>
</html>
